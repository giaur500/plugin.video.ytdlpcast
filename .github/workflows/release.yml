# Builds the add-on's zip with .github/build.sh, the same build as on a desktop,
# with Python 3.11 like Kodi 21 on CoreELEC and a freshly fetched yt-dlp stable.
#
# A pushed tag vX.Y.Z -- matching addon.xml's version -- publishes the zip as a
# GitHub release, its notes taken from addon.xml's <news>. Run by hand
# (Actions -> Release -> Run workflow), it keeps the zip as a test build instead:
# an artifact of the run, for 30 days.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the add-on
        uses: actions/checkout@v4
        with:
          # The zip's folder is named after this directory, and Kodi wants the add-on id.
          path: plugin.video.ytdlpcast

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        id: build
        run: |
          zip="$(plugin.video.ytdlpcast/.github/build.sh "$GITHUB_WORKSPACE/dist")"
          version="$(python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).getroot().get("version"))' plugin.video.ytdlpcast/addon.xml)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match addon.xml's version $VERSION: the tag should be v$VERSION"
            exit 1
          fi
          {
            python3 plugin.video.ytdlpcast/.github/news.py "$VERSION"
            echo
            echo "Install in Kodi: Add-ons → Install from zip file → $(basename "$ZIP")."
          } > notes.md
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY" \
            --title "yt-dlp Cast $VERSION" --notes-file notes.md

      - name: Keep the zip as a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin.video.ytdlpcast-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip }}.sha256
          retention-days: 30
